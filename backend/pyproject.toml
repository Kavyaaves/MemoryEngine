[project]
name = "memory-engine"
version = "0.1.0"
description = "Personal multimodal memory engine - hybrid retrieval, LangGraph agent, hosted AI only (OpenAI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "boto3>=1.34",  # DynamoDB (media files)
    "httpx>=0.27",
    "openai>=3.19",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",  # chat models (answers, quick checks, structured output)
    "langchain-text-splitters>=1.1",  # document chunking
    "langgraph>=0.2",
    "numpy>=1.26",  # vector maths for the diversity reranker (already required by pgvector)
    "pypdf>=4.2",
    "python-docx>=1.1",
    "pillow>=10",  # reads photo EXIF dates (header only — photos are never analysed)
    "tzdata>=2024.1",  # timezone database for zoneinfo (Windows has none built in)
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
eval = ["ragas>=0.2", "datasets>=2.19"]
# Sentiment (app/sentiment/): the local TamilSense model. Included in the Docker image. For a smaller
# CPU-only torch outside Docker, install it first:  pip install torch --index-url https://download.pytorch.org/whl/cpu
sentiment = ["transformers>=4.44", "torch>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "moto[dynamodb]>=5"]  # moto: a fake AWS for tests

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLE", "RUF100"]
# B008: FastAPI's Depends()/File()/Query() defaults are the framework idiom
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
